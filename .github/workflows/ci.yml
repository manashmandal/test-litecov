name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  python-coverage-cobertura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: python
        run: pip install -r requirements.txt

      - name: Run Python tests with coverage (Cobertura XML)
        working-directory: python
        run: |
          pytest --cov=. --cov-report=xml:coverage.xml

      - name: Run litecov
        uses: manashmandal/litecov@fix-issues
        with:
          coverage-file: python/coverage.xml
          format: cobertura
          title: "Python Coverage Report"
          annotations: "true"
          show-files: "all"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
