name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  js-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: js
        run: npm install

      - name: Run JS tests with coverage
        working-directory: js
        run: npm test

      - name: Run litecov
        uses: manashmandal/litecov@fix-issues
        with:
          coverage-file: js/coverage/lcov.info
          title: "JavaScript Coverage Report"
          annotations: "true"
          show-files: "changed"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
