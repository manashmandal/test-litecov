name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  go-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Run Go tests with coverage
        working-directory: go
        run: |
          go test -coverprofile=coverage.out ./...
          # Convert to LCOV
          go install github.com/jandelgado/gcov2lcov@latest
          gcov2lcov -infile=coverage.out -outfile=coverage.lcov

      - name: Run litecov
        uses: manashmandal/litecov@fix-issues
        with:
          coverage-file: go/coverage.lcov
          title: "Go Coverage Report"
          annotations: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-coverage-lcov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: python
        run: pip install -r requirements.txt

      - name: Run Python tests with coverage (LCOV)
        working-directory: python
        run: |
          pytest --cov=. --cov-report=lcov:coverage.lcov

      - name: Run litecov
        uses: manashmandal/litecov@fix-issues
        with:
          coverage-file: python/coverage.lcov
          title: "Python Coverage Report (LCOV)"
          annotations: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-coverage-cobertura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: python
        run: pip install -r requirements.txt

      - name: Run Python tests with coverage (Cobertura XML)
        working-directory: python
        run: |
          pytest --cov=. --cov-report=xml:coverage.xml

      - name: Run litecov
        uses: manashmandal/litecov@fix-issues
        with:
          coverage-file: python/coverage.xml
          format: cobertura
          title: "Python Coverage Report (Cobertura)"
          annotations: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  js-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: js
        run: npm install

      - name: Run JS tests with coverage
        working-directory: js
        run: npm test

      - name: Run litecov
        uses: manashmandal/litecov@fix-issues
        with:
          coverage-file: js/coverage/lcov.info
          title: "JavaScript Coverage Report"
          annotations: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
